# Self-test of the root action.yml (the Marketplace action) on the localhost fixture site:
# one run that must pass and one that must fail. No network beyond the runner itself.
name: Action self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  selftest:
    name: Action self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Serve the fixture site on loopback
        run: |
          (cd tests/fixtures/site && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 0.5; done

      - name: Passing run
        id: pass
        uses: ./
        with:
          url: http://127.0.0.1:8765/
          extract: product
          min-pages: 2
          min-items: 1
          out: report-pass

      - name: Failing run (impossible item count)
        id: fail
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8765/
          extract: product
          min-items: 9999
          out: report-fail

      - name: Assert the outcomes
        env:
          PASS_OUTCOME: ${{ steps.pass.outcome }}
          FAIL_OUTCOME: ${{ steps.fail.outcome }}
          PASS_ITEMS: ${{ steps.pass.outputs.items }}
        run: |
          echo "pass=$PASS_OUTCOME ($PASS_ITEMS items) fail=$FAIL_OUTCOME"
          [ "$PASS_OUTCOME" = success ] && [ "$FAIL_OUTCOME" = failure ]
          # outcome == 'failure' asserted above
